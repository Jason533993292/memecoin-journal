name: Credential rotation review

on:
  schedule:
    - cron: "23 9 1 */3 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Open or refresh the credential review
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Quarterly credential rotation review";
            const body = [
              "Review production and staging credentials without posting their values in this issue.",
              "",
              "- [ ] Rotate Supabase database passwords and service-role keys where supported",
              "- [ ] Rotate Resend and AI-provider server keys",
              "- [ ] Review Firebase service-account keys and remove unused keys",
              "- [ ] Replace the corresponding GitHub and Railway secrets",
              "- [ ] Run the protected staging checks before production",
              "- [ ] Confirm health checks and feedback delivery after rotation",
              "",
              `Created by ${context.workflow} on ${new Date().toISOString().slice(0, 10)}.`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["security"],
              }).catch(async (error) => {
                if (error.status !== 422) throw error;
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
              });
            }
