name: Service monitoring

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify public and dependency health
        run: npm run monitor:services
        env:
          PRODUCTION_BASE_URL: https://memecoin-journal.up.railway.app
          STAGING_BASE_URL: https://memecoin-journal-staging.up.railway.app
          PRODUCTION_HEALTHCHECK_TOKEN: ${{ secrets.PRODUCTION_HEALTHCHECK_TOKEN }}
          STAGING_HEALTHCHECK_TOKEN: ${{ secrets.STAGING_HEALTHCHECK_TOKEN }}

  backup-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify a recent Supabase backup exists
        run: npm run backup:verify
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: tndqtaouizztihzggwnh
          SUPABASE_BACKUP_MAX_AGE_HOURS: "48"

  alert:
    if: ${{ always() && (needs.readiness.result == 'failure' || needs.backup-freshness.result == 'failure') }}
    needs: [readiness, backup-freshness]
    runs-on: ubuntu-latest
    steps:
      - name: Open or refresh the service-health incident
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Automated service-health alert";
            const body = [
              "The scheduled service monitor detected a failure.",
              "",
              `Readiness: **${{ needs.readiness.result }}**`,
              `Backup freshness: **${{ needs.backup-freshness.result }}**`,
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

