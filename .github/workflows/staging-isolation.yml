name: Protected staging isolation

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-staging-isolation
  cancel-in-progress: false

jobs:
  two-account-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Create two disposable users and verify account isolation
        run: npm run test:staging:isolation
        env:
          STAGING_BASE_URL: https://memecoin-journal-staging.up.railway.app
          STAGING_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      - name: Install the protected browser-test runtime
        run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: v2.stable
      - name: Resolve protected staging connection
        run: supabase link --project-ref "$STAGING_SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      - name: Verify manual and wallet trade lifecycle
        run: npm run test:staging:trade-lifecycle
        env:
          STAGING_BASE_URL: https://memecoin-journal-staging.up.railway.app
          STAGING_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
