name: Protected staging isolation

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-staging-isolation
  cancel-in-progress: false

jobs:
  two-account-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Create two disposable users and verify account isolation
        run: npm run test:staging:isolation
        env:
          STAGING_BASE_URL: https://memecoin-journal-staging.up.railway.app
          STAGING_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      - name: Install the protected browser-test runtime
        run: npx playwright install --with-deps chromium
      - name: Verify trade create, refresh, edit, and delete
        run: npm run test:staging:trade-lifecycle
        env:
          STAGING_BASE_URL: https://memecoin-journal-staging.up.railway.app
          STAGING_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
