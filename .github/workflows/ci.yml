name: Release checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Scan source for committed secrets
        run: npm run security:secrets

      - name: Audit high-severity dependency vulnerabilities
        run: npm run security:dependencies

      - name: Lint
        run: npm run lint

      - name: Check operational script syntax
        run: for script in scripts/*.mjs; do node --check "$script"; done

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium

      - name: Run public browser and accessibility checks
        run: npm run test:e2e:desktop
