name: Feedback email delivery

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feedback-email-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process production feedback queue
        run: curl --fail-with-body --silent --show-error --max-time 45 --request POST --header "Authorization: Bearer $FEEDBACK_WORKER_TOKEN" https://memecoin-journal.up.railway.app/api/internal/feedback-delivery
        env:
          FEEDBACK_WORKER_TOKEN: ${{ secrets.PRODUCTION_FEEDBACK_WORKER_TOKEN }}

      - name: Process staging feedback queue
        run: curl --fail-with-body --silent --show-error --max-time 45 --request POST --header "Authorization: Bearer $FEEDBACK_WORKER_TOKEN" https://memecoin-journal-staging.up.railway.app/api/internal/feedback-delivery
        env:
          FEEDBACK_WORKER_TOKEN: ${{ secrets.STAGING_FEEDBACK_WORKER_TOKEN }}
