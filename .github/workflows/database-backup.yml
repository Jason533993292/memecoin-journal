name: Database logical backup

on:
  schedule:
    - cron: "12 3 * * *"
  workflow_dispatch:
    inputs:
      restore_drill:
        type: boolean
        default: false
        description: Restore application data into the disposable runner before encryption

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install maintained Supabase CLI v2
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: v2.stable

      - name: Export roles
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
        run: |
          test -n "$PRODUCTION_SUPABASE_DB_URL" || { echo "PRODUCTION_SUPABASE_DB_URL is not configured."; exit 1; }
          mkdir -p backup
          supabase db dump --db-url "$PRODUCTION_SUPABASE_DB_URL" -f backup/roles.sql --role-only

      - name: Export schema
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
        run: supabase db dump --db-url "$PRODUCTION_SUPABASE_DB_URL" -f backup/schema.sql

      - name: Export data
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
        run: supabase db dump --db-url "$PRODUCTION_SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes"

      - name: Validate backup files
        run: |
          test -s backup/roles.sql
          test -s backup/schema.sql
          test -s backup/data.sql
          grep -Eq "CREATE TABLE|CREATE POLICY|CREATE FUNCTION" backup/schema.sql
          grep -Eq "COPY |INSERT INTO" backup/data.sql
          awk '/^COPY "public"\."[^"]+" / {split($0, a, "\""); name=a[4]; count=0; next} name && $0=="\\." {print "rows|public." name "|" count; name=""; next} name {count++} END {if(name) exit 1}' backup/data.sql > backup/row-counts.txt
          test -s backup/row-counts.txt
          (cd backup && shasum -a 256 roles.sql schema.sql data.sql row-counts.txt > SHA256SUMS)

      - name: Decide whether the monthly restore drill is due
        id: drill
        run: echo "day=$(date -u +%d)" >> "$GITHUB_OUTPUT"

      - name: Restore application data in a disposable local database
        id: restore
        continue-on-error: true
        if: steps.drill.outputs.day == '01' || inputs.restore_drill
        run: bash scripts/restore-public-data-drill.sh

      - name: Encrypt backup before upload
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_AGE_RECIPIENT" || { echo "BACKUP_AGE_RECIPIENT is not configured. Refusing to upload plaintext."; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          mkdir -p upload
          tar -C backup -cf - roles.sql schema.sql data.sql row-counts.txt SHA256SUMS \
            | age -r "$BACKUP_AGE_RECIPIENT" -o upload/production-database-backup.tar.age
          test -s upload/production-database-backup.tar.age
          (cd upload && shasum -a 256 production-database-backup.tar.age > SHA256SUMS)
          find upload -maxdepth 1 -type f ! -name '*.age' ! -name 'SHA256SUMS' -print -quit | grep -q . \
            && { echo "Unexpected plaintext file in upload directory."; exit 1; } || true
          rm -rf backup

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-database-backup-${{ github.run_id }}
          path: upload/
          retention-days: 30
          if-no-files-found: error


      - name: Report restore drill failure
        if: steps.restore.outcome == 'failure'
        run: exit 1
